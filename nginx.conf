# ══════════════════════════════════════════════════════════════
#  Nginx — SC Barbearia
#  Arquivo: /etc/nginx/sites-available/scbarbearia
#
#  COMO USAR:
#  1. Edite "seudominio.com.br" pelo seu domínio real
#  2. sudo cp nginx.conf /etc/nginx/sites-available/scbarbearia
#  3. sudo ln -s /etc/nginx/sites-available/scbarbearia /etc/nginx/sites-enabled/
#  4. sudo nginx -t
#  5. sudo systemctl reload nginx
#  6. SSL grátis: sudo certbot --nginx -d seudominio.com.br
# ══════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name seudominio.com.br www.seudominio.com.br;

    # Tamanho máximo para upload de fotos
    client_max_body_size 10M;

    # Logs
    access_log /var/log/nginx/scbarbearia.access.log;
    error_log  /var/log/nginx/scbarbearia.error.log;

    # Proxy para o Node.js
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Gzip para performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
}
